name: Cross-Build Chromium Windows - Btrfs R2 Resume

on:
  workflow_dispatch:
    inputs:
      auto_resume:
        description: Run the next pass automatically after checkpoint
        type: boolean
        default: false
      pass:
        description: Current pass number
        type: string
        default: '1'
      max_passes:
        description: Maximum automatic passes
        type: string
        default: '12'
      export_only:
        description: Restore the completed R2 checkpoint and export built Windows files (no rebuild)
        type: boolean
        default: false
      r2_upload_mode:
        description: R2 upload mode (LineageOS-proven stream, or chunked fallback)
        type: choice
        options:
          - stream
          - chunked
        default: stream

permissions:
  contents: read
  actions: write

concurrency:
  group: chromium-windows-155-r2-v3
  cancel-in-progress: false

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CHROMIUM_VERSION: '155.0.8059.79'
      WORK: /mnt/chromium-ci/work
      IMAGE: /home/runner/work/chromium-ci.img
      IMAGE_GIB: '220'
      BTRFS_ZSTD: '1'
      MIN_FREE_GIB: '12'
      BUILD_JOBS: '3'
      PINNED_RCLONE_VERSION: '1.75.2'
      # Keep the existing prefix to restore committed legacy layers.
      R2_ROOT: r2:${{ vars.R2_BUCKET || secrets.R2_BUCKET }}/chromium-win155-x64-v3
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
      R2_UPLOAD_MODE: ${{ inputs.r2_upload_mode || 'stream' }}
      DEPOT_TOOLS_WIN_TOOLCHAIN: '1'
      GIT_TERMINAL_PROMPT: '0'
      TOOLCHAIN_URL: https://pub-8f1f5b85dfa3490cb6526249c67b4237.r2.dev/chromium-win-toolchain-vs2026-sdk28000.zip
      TOOLCHAIN_SHA256: ${{ vars.TOOLCHAIN_SHA256 }}

    steps:
      - name: Reclaim disk and install build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          FREE_BEFORE=$(df -Pk / | awk 'NR==2 {print $4}')
          echo '=== BEFORE CLEANUP ==='
          df -h /
          free -h

          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile /mnt/soong-swap-base || true
          sudo systemctl stop docker.service docker.socket containerd.service 2>/dev/null || true
          sudo rm -rf \
            /var/lib/docker /var/lib/containerd /var/cache/apt/archives/* \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/lib/node_modules /usr/local/graalvm \
            /usr/share/rust /usr/share/php* /usr/local/share/chromium \
            /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/local/share/vcpkg /opt/google /opt/microsoft /usr/share/postgresql \
            /usr/share/mysql /usr/local/julia* /opt/az \
            /usr/local/google-cloud-sdk /usr/lib/google-cloud-sdk \
            /usr/local/share/gradle /usr/share/gradle /opt/pipx \
            /home/runner/.gradle/caches /home/runner/.npm/_cacache \
            /home/runner/.cache/pip /root/.cache/pip || true

          sudo apt-get clean || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            btrfs-progs ciopfs fuse3 zstd unzip zip jq git git-lfs ninja-build
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo '=== Install pinned modern rclone (Ubuntu 24.04 apt is 1.60.1) ==='
          RCLONE_TMP="$RUNNER_TEMP/rclone-v${PINNED_RCLONE_VERSION}"
          mkdir -p "$RCLONE_TMP"
          RCLONE_FILE="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.zip"
          curl -fL --retry 5 --retry-delay 5 \
            "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/${RCLONE_FILE}" \
            -o "$RCLONE_TMP/$RCLONE_FILE"
          curl -fL --retry 5 --retry-delay 5 \
            "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/SHA256SUMS" \
            -o "$RCLONE_TMP/SHA256SUMS"
          (cd "$RCLONE_TMP" && \
            awk -v file="$RCLONE_FILE" '$2 == file {print}' SHA256SUMS \
              | sha256sum --check -)
          unzip -q "$RCLONE_TMP/$RCLONE_FILE" -d "$RCLONE_TMP"
          sudo install -m 0755 \
            "$RCLONE_TMP/rclone-v${PINNED_RCLONE_VERSION}-linux-amd64/rclone" \
            /usr/local/bin/rclone
          /usr/local/bin/rclone version

          cat > "$GITHUB_WORKSPACE/ci-metrics.sh" <<'SH'
          ci_metrics() {
            echo '====== CI RESOURCE REPORT ======'
            echo "Time: $(date -u +%FT%TZ)"
            echo "CPU: $(nproc)"
            echo '--- RAM / Swap ---'
            free -h || true
            echo '--- Host disk ---'
            df -h / || true
            echo '--- Host free bytes ---'
            df -PB1 / || true
            if mountpoint -q /mnt/chromium-ci; then
              echo '--- Btrfs filesystem ---'
              df -h /mnt/chromium-ci || true
              sudo btrfs filesystem usage /mnt/chromium-ci || true
            fi
            if [ -f "${IMAGE:-/nonexistent}" ]; then
              echo '--- Sparse image actual disk usage ---'
              du -h "$IMAGE" || true
            fi
            echo '================================'
          }
          ci_begin() {
            echo "=== STEP: $1 ==="
            ci_metrics
            trap 'ci_metrics' EXIT
          }
          SH

          FREE_AFTER=$(df -Pk / | awk 'NR==2 {print $4}')
          awk -v before="$FREE_BEFORE" -v after="$FREE_AFTER" \
            'BEGIN {printf "Before: %.2f GiB, after: %.2f GiB, net change: %.2f GiB\n", before/1048576, after/1048576, (after-before)/1048576}'
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Disk cleanup'
          rclone version
          ninja --version

      - name: Create Btrfs 220 GiB ZSTD1 workspace
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Btrfs init'
          sudo install -d -m 0755 /mnt/chromium-ci
          sudo truncate -s "${IMAGE_GIB}G" "$IMAGE"
          sudo mkfs.btrfs -f -q "$IMAGE"
          sudo mount -o loop,compress=zstd:1,discard=async "$IMAGE" /mnt/chromium-ci
          sudo chown "$USER:$USER" /mnt/chromium-ci
          mkdir -p "$WORK"
          findmnt /mnt/chromium-ci

      - name: Preflight R2 upload method before Chromium build
        if: ${{ !inputs.export_only }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'R2 upload preflight'
          echo "R2 upload mode: $R2_UPLOAD_MODE"
          echo 'Rclone configuration: Cloudflare S3, no_check_bucket=true'
          test "$(rclone version | head -1)" = "rclone v1.75.2"
          PROBE="$R2_ROOT/probes/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${R2_UPLOAD_MODE}.bin"
          if [ "$R2_UPLOAD_MODE" = stream ]; then
            echo '=== Test 70 MiB multipart rcat before spending hours compiling ==='
            # Over 64 MiB cutoff, so this tests multipart POST, not just PutObject.
            head -c $((70*1024*1024)) /dev/zero \
              | rclone rcat "$PROBE" \
                  --stats 30s --stats-one-line \
                  --s3-upload-cutoff 64M \
                  --s3-chunk-size 64M \
                  --s3-upload-concurrency 4
            EXPECTED=$((70*1024*1024))
          elif [ "$R2_UPLOAD_MODE" = chunked ]; then
            echo '=== Test single-PUT rclone copyto fallback ==='
            printf 'chromium-r2-single-put-%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/r2-test.txt"
            rclone copyto "$RUNNER_TEMP/r2-test.txt" "$PROBE" \
              --s3-upload-cutoff 512M --retries 5
            EXPECTED="$(stat -c %s "$RUNNER_TEMP/r2-test.txt")"
          else
            echo "::error::Unknown R2_UPLOAD_MODE=$R2_UPLOAD_MODE"
            exit 1
          fi
          ACTUAL="$(rclone size "$PROBE" --json | jq -r '.bytes')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::R2 preflight size mismatch expected=$EXPECTED actual=$ACTUAL"
            exit 1
          fi
          rclone deletefile "$PROBE" || true
          echo 'R2 upload preflight=PASS'

      - name: Restore committed checkpoint from R2 (export-safe overlay)
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'R2 restore'
          : "${R2_BUCKET:?Set Actions variable R2_BUCKET}"
          : "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}"
          : "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}"
          rclone lsf "r2:$R2_BUCKET" >/dev/null

          echo "Checkpoint prefix: $R2_ROOT"
          LISTING="$(rclone lsjson "$R2_ROOT" --files-only --no-modtime --no-mimetype)"
          POINTER_SIZE="$(jq -r '[.[] | select(.Name == "latest.txt") | .Size] | first // -1' <<< "$LISTING")"
          LAST=0
          if (( POINTER_SIZE == -1 )); then
            echo 'No committed checkpoint: fresh build (layer 0).'
          elif (( POINTER_SIZE == 0 )); then
            echo '::error::R2 latest.txt is empty. Refusing destructive fallback.'
            exit 1
          else
            rclone copyto "$R2_ROOT/latest.txt" "$RUNNER_TEMP/latest.txt" --retries 5
            LAST="$(tr -d '[:space:]' < "$RUNNER_TEMP/latest.txt")"
            [[ "$LAST" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Invalid checkpoint pointer: $LAST"
              exit 1
            }
          fi
          echo "Committed checkpoint: $LAST"

          # GNU tar incremental extraction may infer directory renames from
          # inode records across snapshots and fail with 'Directory not empty'.
          # Export-only requires the compiled outputs, not an exact filesystem
          # mirror for continuing Ninja. Overlay extraction deliberately skips
          # GNU incremental directory renames/deletions while applying file data
          # in chronological order. Do NOT use this mode for build/resume.
          TAR_RESTORE_ARGS=(
            --extract --xattrs '--xattrs-include=user.*'
            --no-same-owner --no-same-permissions
          )
          if [[ '${{ inputs.export_only }}' == 'true' ]]; then
            TAR_RESTORE_ARGS+=(--no-overwrite-dir)
            echo 'Restore mode: export-only overlay (no incremental rename/purge)'
            if (( LAST == 0 )); then
              echo '::error::export_only requested but R2 has no committed checkpoint'
              exit 1
            fi
          else
            TAR_RESTORE_ARGS+=(--listed-incremental=/dev/null)
            echo 'Restore mode: exact GNU tar incremental for Ninja resume'
          fi

          if (( LAST > 0 )); then
            for N in $(seq 1 "$LAST"); do
              echo "=== Restoring layer $N/$LAST ==="
              # v4 checkpoint: independently uploaded 256MiB single-PUT objects.
              # Continue to read previously committed v3 .tar.zst layers.
              LAYER_LIST="$(rclone lsjson "$R2_ROOT/layers/$N" --files-only --no-modtime --no-mimetype)"
              if jq -e '[.[] | select(.Name == "manifest.json")] | length == 1' \
                <<< "$LAYER_LIST" >/dev/null; then
                MANIFEST="$RUNNER_TEMP/r2-manifest-$N.json"
                rclone copyto "$R2_ROOT/layers/$N/manifest.json" "$MANIFEST" --retries 5
                python3 - "$R2_ROOT/layers/$N" "$MANIFEST" "$RUNNER_TEMP" <<'PYRESTORE' \
                  | zstd -d -c \
                  | tar "${TAR_RESTORE_ARGS[@]}" -C "$WORK" -f -
          import hashlib
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          prefix, manifest_path, scratch = sys.argv[1:]
          manifest = json.loads(Path(manifest_path).read_text())
          if manifest.get('format') != 'chunked-zstd-tar-v1':
              raise SystemExit('Unsupported checkpoint format')
          parts = manifest.get('parts')
          if not isinstance(parts, list) or not parts:
              raise SystemExit('Empty or invalid checkpoint manifest')
          scratch = Path(scratch)
          for i, part in enumerate(parts):
              name = part.get('name', '')
              if name != f'part-{i:06d}.bin':
                  raise SystemExit(f'Unexpected checkpoint part: {name!r}')
              expected_size = part.get('size')
              expected_sha = part.get('sha256', '')
              if not isinstance(expected_size, int) or not (0 < expected_size <= 256*1024*1024):
                  raise SystemExit(f'Invalid part size: {expected_size}')
              if not re.fullmatch('[0-9a-f]{64}', expected_sha):
                  raise SystemExit(f'Invalid SHA256 for {name}')
              local = scratch / f'r2-restore-{i:06d}.bin'
              try:
                  print(f'Restoring {name} ({expected_size} bytes)', file=sys.stderr, flush=True)
                  subprocess.run(['rclone', 'copyto', f'{prefix}/{name}', str(local),
                                  '--retries', '5', '--low-level-retries', '10'], check=True)
                  digest = hashlib.sha256()
                  total = 0
                  with local.open('rb') as f:
                      while True:
                          buf = f.read(4*1024*1024)
                          if not buf:
                              break
                          total += len(buf)
                          digest.update(buf)
                  if total != expected_size or digest.hexdigest() != expected_sha:
                      raise SystemExit(f'Corrupt checkpoint part {name}; refusing restore')
                  with local.open('rb') as f:
                      while True:
                          buf = f.read(4*1024*1024)
                          if not buf:
                              break
                          sys.stdout.buffer.write(buf)
              finally:
                  local.unlink(missing_ok=True)
          sys.stdout.buffer.flush()
          PYRESTORE
              else
                echo "Single-object checkpoint: $N.tar.zst"
                EXPECTED_HASH="$RUNNER_TEMP/layer-$N-expected.sha256"
                RECEIVED_HASH="$RUNNER_TEMP/layer-$N-received.sha256"
                HAS_SHA=0
                if rclone lsf "$R2_ROOT/layers" --files-only \
                    | grep -Fxq "$N.sha256"; then
                  rclone copyto "$R2_ROOT/layers/$N.sha256" "$EXPECTED_HASH" --retries 5
                  test -s "$EXPECTED_HASH"
                  HAS_SHA=1
                fi
                # Hash compressed data while streaming; do not buffer huge archives.
                HASH_RELAY=$'import hashlib,sys\nh=hashlib.sha256(); i=sys.stdin.buffer; o=sys.stdout.buffer\nwhile True:\n b=i.read(8*1024*1024)\n if not b: break\n h.update(b); o.write(b); o.flush()\nopen(sys.argv[1],"w").write(h.hexdigest()+"\\n")'
                rclone cat "$R2_ROOT/layers/$N.tar.zst" --stats 30s --stats-one-line \
                  | python3 -c "$HASH_RELAY" "$RECEIVED_HASH" \
                  | zstd -d -c \
                  | tar "${TAR_RESTORE_ARGS[@]}" -C "$WORK" -f -
                if (( HAS_SHA )); then
                  cmp -s "$EXPECTED_HASH" "$RECEIVED_HASH" || {
                    echo "::error::Checkpoint $N compressed SHA256 mismatch"
                    exit 1
                  }
                fi
              fi
            done
            if [[ '${{ inputs.export_only }}' == 'true' ]]; then
              echo '=== Verify exported build after overlay restore ==='
              test -s "$WORK/chromium_build/src/out/Default/chrome.exe" || {
                echo '::error::Restored layers do not contain chrome.exe'
                exit 1
              }
              test -f "$WORK/.build-complete" || {
                echo '::error::Missing build-complete marker in restored layers'
                exit 1
              }
              echo 'chrome.exe and build-complete marker verified.'
              echo 'Note: export overlay is not suitable for resuming Ninja.'
            fi
            if [[ '${{ inputs.export_only }}' != 'true' ]]; then
              # A resumed build needs the GNU tar metadata for its next backup.
              rclone copyto "$R2_ROOT/state/$LAST.snar" "$RUNNER_TEMP/previous.snar" --retries 5
              test -s "$RUNNER_TEMP/previous.snar"
            else
              echo 'Skipping .snar download: export_only will not create new layers.'
            fi
          fi
          mkdir -p "$WORK"
          echo "RESTORED_LAST=$LAST" >> "$GITHUB_ENV"
          echo "checkpoint=$LAST" >> "$GITHUB_OUTPUT"
          echo "R2 restore complete at layer $LAST"

      - name: Set up depot_tools
        if: ${{ !inputs.export_only }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'depot_tools'
          if [ ! -d "$WORK/depot_tools/.git" ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK/depot_tools"
          fi
          echo "$WORK/depot_tools" >> "$GITHUB_PATH"
          export PATH="$WORK/depot_tools:$PATH"
          command -v gclient

      - name: Fetch or resume Chromium sources
        id: sync
        if: ${{ !inputs.export_only }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Chromium sync'
          export PATH="$WORK/depot_tools:$PATH"
          ROOT="$WORK/chromium_build"
          SRC="$ROOT/src"
          mkdir -p "$ROOT"
          if [ -f "$WORK/.source-ready" ] && [ -f "$SRC/DEPS" ]; then
            echo 'Restored synchronized sources.'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEADLINE=$((RUN_START + 260*60))
          LEFT=$((DEADLINE - $(date +%s)))
          if (( LEFT < 300 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 --branch "$CHROMIUM_VERSION" \
              https://chromium.googlesource.com/chromium/src.git "$SRC"
          fi
          cd "$ROOT"
          if [ ! -f .gclient ]; then
            gclient config --unmanaged --name=src https://chromium.googlesource.com/chromium/src.git
          fi
          # Ensure host Linux dependencies plus Windows dependencies are synchronized.
          python3 - <<'PY'
          from pathlib import Path
          f = Path('.gclient')
          s = f.read_text()
          if 'target_os =' not in s:
              f.write_text(s + "\ntarget_os = ['win']\n")
          elif "target_os = ['win']" not in s:
              raise SystemExit('Unexpected .gclient target_os setting')
          PY
          LEFT=$((DEADLINE - $(date +%s)))
          if (( LEFT < 300 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          timeout -s INT -k 90s "${LEFT}s" \
            gclient sync --nohooks --no-history --jobs 4
          RC=$?
          set -e
          if (( RC == 0 )); then
            touch "$WORK/.source-ready"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif (( RC == 124 )); then
            echo 'Sync time slice complete, checkpointing.'
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            echo "::error::gclient sync failed with $RC"
            exit "$RC"
          fi

      - name: Install VS 2026 SDK28000 toolchain (ciopfs-safe)
        id: toolchain
        if: steps.sync.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Windows toolchain - inspect, extract and validate'
          export PATH="$WORK/depot_tools:$PATH"
          SRC="$WORK/chromium_build/src"
          BACKING="$WORK/win_toolchain_backing"
          VIEW="$WORK/win_toolchain"
          CACHE="$WORK/toolchain-download"
          # IMPORTANT: ciopfs maps visible mixed-case names onto lowercase
          # filenames in BACKING. The previous workflow extracted ZIP entries
          # with names such as VS_VERSION, VC, and Windows Kits directly into
          # BACKING, making them invisible through VIEW.
          # A failed previous run may have checkpointed that broken tree to R2.
          # Clean only this corrupted toolchain tree, preserving the downloaded
          # ZIP and all Chromium source/build outputs.
          if mountpoint -q "$VIEW"; then
            echo 'ciopfs mount already active.'
          else
            if [ -e "$BACKING/VS_VERSION" ] || \
               [ -d "$BACKING/VC" ] || \
               [ -d "$BACKING/Windows Kits" ]; then
              echo '=== Repair previous uppercase ciopfs backing ==='
              echo 'Detected ZIP files extracted directly to the backing tree.'
              du -sh "$BACKING" || true
              rm -rf "$BACKING"
              echo 'Removed broken toolchain extraction; cached ZIP is retained.'
            fi
          fi
          mkdir -p "$BACKING" "$VIEW" "$CACHE"
          if ! mountpoint -q "$VIEW"; then
            ciopfs -o use_ino "$BACKING" "$VIEW"
          fi
          mountpoint -q "$VIEW" || { echo '::error::ciopfs mount failed'; exit 1; }
          echo '=== Verify ciopfs write/read path ==='
          printf 'case-insensitive-ok\n' > "$VIEW/CiOpFs-Sanity-Check"
          test -f "$BACKING/ciopfs-sanity-check" || {
            echo '::error::ciopfs did not create lowercase backing filename.'
            exit 1
          }
          test "$(cat "$VIEW/CIOPFS-SANITY-CHECK")" = 'case-insensitive-ok' || {
            echo '::error::ciopfs case-insensitive lookup failed.'
            exit 1
          }
          rm -f "$VIEW/CiOpFs-Sanity-Check"

          # Existing backing files are checkpointed, but FUSE mount is NOT:
          # remount ciopfs before checking the toolchain on each new runner.
          if [ -f "$WORK/.win-toolchain-ready" ] && \
             [ -f "$SRC/build/win_toolchain.json" ] && \
             [ -f "$VIEW/VS_VERSION" ] && \
             [ -f "$VIEW/Windows Kits/10/bin/SetEnv.x64.json" ]; then
            echo 'Restored VS/SDK package; skipping download and extraction.'
          else
            LEFT=$((RUN_START + 260*60 - $(date +%s)))
            if (( LEFT < 1200 )); then
              echo 'Not enough time left to download/extract; checkpointing.'
              echo 'resume=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ZIP="$CACHE/package.zip"
            if [ ! -s "$ZIP" ]; then
              echo '=== Downloading toolchain ZIP to persistent Btrfs cache ==='
              # A .part download is not trusted; resume transfers only if server
              # supports HTTP Range, otherwise curl restarts the download.
              set +e
              timeout -s INT -k 90s "${LEFT}s" \
                curl -fL --retry 5 --retry-delay 5 \
                  --continue-at - "$TOOLCHAIN_URL" -o "$CACHE/package.part"
              RC=$?
              set -e
              if (( RC == 124 )); then
                echo 'Toolchain transfer time slice reached.'
                echo 'resume=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              (( RC == 0 )) || exit "$RC"
              mv "$CACHE/package.part" "$ZIP"
            fi
            if [ -n "${TOOLCHAIN_SHA256:-}" ]; then
              echo "$TOOLCHAIN_SHA256  $ZIP" | sha256sum -c -
            fi

            echo '=== Inspect ZIP nesting, entries and SDK version ==='
            LEFT=$((RUN_START + 260*60 - $(date +%s)))
            if (( LEFT < 300 )); then
              echo 'Not enough time for extraction; preserving ZIP in R2 checkpoint.'
              echo 'resume=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # The Windows packaging action uploaded a ZIP *inside* an Actions
            # Artifact. Python zipfile + normalized paths supports either format.
            # Extract THROUGH ciopfs VIEW. Direct writes to BACKING with
            # uppercase names are invisible inside the FUSE mount.
            set +e
            timeout -s INT -k 90s "${LEFT}s" \
              python3 - "$ZIP" "$VIEW" <<'PY'
          import os
          import re
          import shutil
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          outer = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          sdk = '10.0.28000.0'

          def norm(name):
              # ZIPs produced on Windows may use either slash convention.
              return name.replace('\\', '/').lstrip('./')

          def summary(zf, label):
              names = [norm(i.filename) for i in zf.infolist()]
              print(f'{label}: {len(names)} entries', flush=True)
              for name in names[:18]:
                  print('  ZIP:', name, flush=True)
              return names

          def package_prefix(names):
              # Official package_from_installed.py includes VS_VERSION at root.
              markers = [n[:-len('VS_VERSION')] for n in names
                         if n.casefold().endswith('vs_version')]
              for prefix in sorted(markers, key=len):
                  low = [n[len(prefix):].lower() for n in names
                         if n.startswith(prefix)]
                  has_vs = any(re.match(
                      r'vc/tools/msvc/[^/]+/include/', n) for n in low)
                  has_sdk = any(n.startswith(
                      f'windows kits/10/include/{sdk.lower()}/') for n in low)
                  if has_vs and has_sdk:
                      return prefix
              return None

          def extract(zf, prefix, dest):
              count = 0
              for info in zf.infolist():
                  path = norm(info.filename)
                  if not path.startswith(prefix):
                      continue
                  relative = path[len(prefix):]
                  if not relative or info.is_dir() or path.endswith('/'):
                      continue
                  parts = relative.split('/')
                  if any(p in ('', '.', '..') for p in parts) or ':' in parts[0]:
                      raise SystemExit(f'Unsafe path in ZIP: {relative!r}')
                  target = dest.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  # Atomic replacement avoids trusting partial extracted files
                  # when the process is interrupted and a later pass resumes.
                  tmp = target.with_name(target.name + '.ci-unpacking')
                  with zf.open(info) as src, open(tmp, 'wb') as out:
                      shutil.copyfileobj(src, out, length=2 * 1024 * 1024)
                  os.replace(tmp, target)
                  count += 1
                  if count % 3000 == 0:
                      print(f'Extracted {count} files...', flush=True)
              print(f'Extracted {count} package files to {dest}', flush=True)
              if count == 0:
                  raise SystemExit('ZIP selection contained no files')

          with zipfile.ZipFile(outer) as zf:
              names = summary(zf, 'Downloaded archive')
              prefix = package_prefix(names)
              if prefix is None:
                  candidates = [i for i in zf.infolist()
                                if re.search(r'(?i)(?:^|/)[0-9a-f]{10}\.zip$',
                                             norm(i.filename))]
                  if len(candidates) != 1:
                      candidates = [i for i in zf.infolist()
                                    if norm(i.filename).lower().endswith('.zip')]
                  if len(candidates) != 1:
                      raise SystemExit(
                          'Archive contains no VS_VERSION/MSVC/SDK tree and '
                          f'{len(candidates)} nested ZIP candidates; '
                          'expected toolchain ZIP or a GitHub Artifact ZIP.')
                  inner_name = norm(candidates[0].filename)
                  print('Found nested toolchain ZIP:', inner_name, flush=True)
                  with tempfile.NamedTemporaryFile(
                      dir=outer.parent, suffix='.zip') as temp:
                      with zf.open(candidates[0]) as src:
                          shutil.copyfileobj(src, temp, length=4 * 1024 * 1024)
                      temp.flush()
                      with zipfile.ZipFile(temp.name) as nested:
                          summary(nested, 'Nested package')
                          prefix = package_prefix(
                              [norm(i.filename) for i in nested.infolist()])
                          if prefix is None:
                              raise SystemExit(
                                  'Nested ZIP does not contain MSVC + SDK '
                                  f'{sdk} + VS_VERSION: verify publishing URL.')
                          archives = [(nested, prefix)]
                          extract(archives[0][0], archives[0][1], destination)
              else:
                  extract(zf, prefix, destination)

          PY
            RC=$?
            set -e
            if (( RC == 124 )); then
              echo 'Toolchain extraction time slice elapsed; retry next pass.'
              echo 'resume=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            (( RC == 0 )) || exit "$RC"

            echo '=== Toolchain files now visible through ciopfs ==='
            ls -ld "$VIEW/VS_VERSION" "$VIEW/VC/Tools/MSVC" \
              "$VIEW/Windows Kits/10" || true
            test -f "$VIEW/VS_VERSION" || {
              echo '::error::VS_VERSION still not visible in ciopfs mount.'
              echo 'Visible entries:'
              ls -lah "$VIEW" | head -n 40
              echo 'Backing entries:'
              ls -lah "$BACKING" | head -n 40
              exit 1
            }

            # Configure Chromium using the packaged, already generated
            # SetEnv.x64.json (not a home-made INCLUDE/LIB approximation).
            python3 - "$VIEW" "$BACKING" "$SRC" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          view, backing, src = map(Path, sys.argv[1:])
          setup = src / 'build/toolchain/win/setup_toolchain.py'
          source = setup.read_text()
          match = re.search(r'^SDK_VERSION\s*=\s*[\'\"]([^\'\"]+)', source, re.M)
          expected_sdk = match.group(1) if match else '10.0.28000.0'
          sdk = '10.0.28000.0'
          if expected_sdk != sdk:
              raise SystemExit(f'Chromium expects Windows SDK {expected_sdk}, '
                               f'but ZIP contains {sdk}.')

          root = view
          vs_version = (root / 'VS_VERSION').read_text().strip()
          if vs_version != '2026':
              raise SystemExit(f'Unexpected VS_VERSION={vs_version!r}')

          incs = sorted((root / 'VC/Tools/MSVC').glob('*/include'))
          sdkroot = root / 'Windows Kits/10'
          sdkinc = sdkroot / 'Include' / sdk
          if not incs or not (sdkinc / 'um').is_dir() or not (sdkinc / 'ucrt').is_dir():
              raise SystemExit('Toolchain ZIP missing VC headers or SDK Include/10.0.28000.0')

          vc_root = incs[-1].parent
          vc_bin = vc_root / 'bin/HostX64/x64'
          required = [
              vc_bin / 'cl.exe',
              vc_root / 'lib/x64',
              sdkroot / 'Lib' / sdk / 'um/x64',
              sdkroot / 'Lib' / sdk / 'ucrt/x64',
              sdkroot / 'bin/SetEnv.x64.json',
          ]
          for p in required:
              if not p.exists():
                  raise SystemExit(f'Missing toolchain component: {p}')

          # Windows packager already generated the original relative paths.
          # Access/write ONLY via ciopfs VIEW, never directly through BACKING.
          original = view / 'Windows Kits/10/bin/SetEnv.x64.json'
          data = json.loads(original.read_text())
          env = data['env']
          for key, groups in env.items():
              env[key] = [[part.replace('\\', '/') for part in parts]
                          for parts in groups]
          original.write_text(json.dumps(data, indent=2))

          def runtime(d):
              p = root / d
              return str(p) if p.is_dir() else 'Arm64Unused'

          config = {
              'path': str(root),
              'version': vs_version,
              'win_sdk': str(sdkroot),
              'wdk': '',
              'runtime_dirs': [runtime('sys64'), runtime('sys32'),
                               runtime('sysarm64')],
          }
          result = src / 'build/win_toolchain.json'
          result.write_text(json.dumps(config, indent=2))
          print('VS:', vs_version, 'MSVC:', vc_root.name)
          print('SDK:', sdkroot, 'version:', sdk)
          print('SetEnv:', original)
          print('Chromium configuration:', result)
          PY
            touch "$WORK/.win-toolchain-ready"
            # A successful extraction no longer needs a second ZIP copy in R2.
            rm -f "$CACHE/package.zip" "$CACHE/package.part"
          fi
          test -f "$SRC/build/win_toolchain.json"
          test -f "$VIEW/Windows Kits/10/bin/SetEnv.x64.json"
          python3 "$SRC/build/vs_toolchain.py" get_toolchain_dir

      - name: Run Chromium gclient hooks
        id: hooks
        if: steps.toolchain.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'gclient hooks'
          export PATH="$WORK/depot_tools:$PATH"
          if [ -f "$WORK/.hooks-ready" ]; then
            echo 'Hooks restored.'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LEFT=$((RUN_START + 260*60 - $(date +%s)))
          if (( LEFT < 300 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$WORK/chromium_build"
          set +e
          DEPOT_TOOLS_WIN_TOOLCHAIN=0 timeout -s INT -k 90s "${LEFT}s" gclient runhooks
          RC=$?
          set -e
          if (( RC == 0 )); then
            touch "$WORK/.hooks-ready"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif (( RC == 124 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            echo "::error::gclient runhooks failed with $RC"
            exit "$RC"
          fi

      - name: Generate GN build graph
        id: gn
        if: steps.hooks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'GN gen'
          export PATH="$WORK/depot_tools:$PATH"
          cd "$WORK/chromium_build/src"
          if (( RUN_START + 260*60 - $(date +%s) < 300 )); then
            echo 'Not enough time for GN; saving checkpoint.'
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p out/Default
          cat > out/Default/args.gn <<'GN'
          target_os = "win"
          target_cpu = "x64"
          is_debug = false
          is_component_build = false
          is_official_build = false
          is_clang = true
          symbol_level = 0
          blink_symbol_level = 0
          GN
          # Do not set visual_studio_path: use the installed hermetic JSON.
          python3 build/vs_toolchain.py get_toolchain_dir
          gn gen out/Default
          test -f out/Default/build.ninja
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Continue incremental Ninja build
        id: build
        if: steps.gn.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Ninja build'
          export PATH="$WORK/depot_tools:$PATH"
          cd "$WORK/chromium_build/src"
          LEFT=$((RUN_START + 260*60 - $(date +%s)))
          if (( LEFT < 300 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Build time budget: ${LEFT}s; jobs=${BUILD_JOBS}"
          set +e
          timeout -s INT -k 120s "${LEFT}s" \
            ninja -C out/Default -j "$BUILD_JOBS" chrome \
            > "$WORK/ninja-build.log" 2>&1 &
          PID=$!
          STOPPED_FOR_DISK=0
          while kill -0 "$PID" 2>/dev/null; do
            sleep 45
            tail -n 8 "$WORK/ninja-build.log" || true
            FREE_KIB=$(df -Pk / | awk 'NR==2 {print $4}')
            if (( FREE_KIB < MIN_FREE_GIB*1024*1024 )); then
              echo "Low physical free space: ${FREE_KIB} KiB; stopping Ninja."
              STOPPED_FOR_DISK=1
              kill -INT "$PID" || true
              break
            fi
          done
          wait "$PID"
          RC=$?
          set -e
          if (( RC == 0 )); then
            test -f out/Default/chrome.exe
            touch "$WORK/.build-complete"
            echo 'completed=true' >> "$GITHUB_OUTPUT"
          elif (( RC == 124 || STOPPED_FOR_DISK == 1 )); then
            echo 'Build interrupted safely for checkpoint.'
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            tail -n 100 "$WORK/ninja-build.log" || true
            echo "::error::Ninja failed with $RC"
            exit "$RC"
          fi

      - name: Upload verified incremental checkpoint to R2
        id: checkpoint
        if: ${{ !inputs.export_only && always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'R2 incremental checkpoint'
          PREV="${RESTORED_LAST:-0}"
          NEXT=$((PREV + 1))
          NEW_STATE="$RUNNER_TEMP/new.snar"
          if (( PREV > 0 )); then
            cp "$RUNNER_TEMP/previous.snar" "$NEW_STATE"
          fi

          echo "=== Checkpoint layer $NEXT, upload_mode=$R2_UPLOAD_MODE ==="
          # GNU tar snapshot state will only be committed after remote verification.
          if [ "$R2_UPLOAD_MODE" = stream ]; then
            # Identical S3 multipart parameters to the successful LineageOS workflow.
            HASH_FILE="$RUNNER_TEMP/layer-$NEXT.sha256"
            BYTES_FILE="$RUNNER_TEMP/layer-$NEXT.bytes"
            REMOTE="$R2_ROOT/layers/$NEXT.tar.zst"
            HASH_RELAY=$'import hashlib,sys\nh=hashlib.sha256(); n=0\ni=sys.stdin.buffer; o=sys.stdout.buffer\nwhile True:\n b=i.read(8*1024*1024)\n if not b: break\n h.update(b); n+=len(b); o.write(b); o.flush()\nopen(sys.argv[1],"w").write(h.hexdigest()+"\\n")\nopen(sys.argv[2],"w").write(str(n)+"\\n")'
            echo "=== Stream GNU tar incremental ZSTD1 directly to R2 ==="
            tar -c --no-check-device --one-file-system \
              --xattrs --xattrs-include='user.*' \
              --listed-incremental="$NEW_STATE" \
              --exclude='./win_toolchain' \
              -C "$WORK" -f - . \
              | zstd -1 -T2 -c \
              | python3 -c "$HASH_RELAY" "$HASH_FILE" "$BYTES_FILE" \
              | rclone rcat "$REMOTE" \
                  --stats 30s --stats-one-line \
                  --s3-upload-cutoff 64M \
                  --s3-chunk-size 64M \
                  --s3-upload-concurrency 4

            test -s "$HASH_FILE"
            test -s "$BYTES_FILE"
            LOCAL_BYTES="$(tr -d '[:space:]' < "$BYTES_FILE")"
            [[ "$LOCAL_BYTES" =~ ^[1-9][0-9]*$ ]]
            REMOTE_BYTES="$(rclone size "$REMOTE" --json | jq -r '.bytes')"
            if [ "$LOCAL_BYTES" != "$REMOTE_BYTES" ]; then
              echo "::error::R2 layer size mismatch local=$LOCAL_BYTES remote=$REMOTE_BYTES"
              exit 1
            fi
            # Sidecar is uploaded only once the large object exists and matches size.
            rclone copyto "$HASH_FILE" "$R2_ROOT/layers/$NEXT.sha256" --retries 5
            rclone copyto "$BYTES_FILE" "$R2_ROOT/layers/$NEXT.bytes" --retries 5
            echo "R2 stream uploaded: ${REMOTE_BYTES} bytes, SHA256=$(cat "$HASH_FILE")"
          elif [ "$R2_UPLOAD_MODE" = chunked ]; then
            echo 'Using the existing 256 MiB single-PUT fallback.'
          cat > "$RUNNER_TEMP/r2-upload-chunks.py" <<'PYUPLOAD'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          prefix = sys.argv[1]
          scratch = Path(sys.argv[2])
          parts = []
          part_bytes = 256 * 1024 * 1024
          index = 0
          while True:
              temp = tempfile.NamedTemporaryFile(
                  prefix='r2-chunk-', suffix='.bin', dir=scratch, delete=False)
              local = Path(temp.name)
              digest = hashlib.sha256()
              written = 0
              try:
                  with temp:
                      while written < part_bytes:
                          buf = sys.stdin.buffer.read(min(4*1024*1024, part_bytes-written))
                          if not buf:
                              break
                          temp.write(buf)
                          digest.update(buf)
                          written += len(buf)
                  if written == 0:
                      break
                  name = f'part-{index:06d}.bin'
                  print(f'Uploading {name}: {written/1024**2:.1f} MiB',
                        file=sys.stderr, flush=True)
                  subprocess.run([
                      'rclone', 'copyto', str(local), f'{prefix}/{name}',
                      '--s3-upload-cutoff', '512M',
                      '--retries', '5', '--low-level-retries', '10',
                      '--stats', '60s', '--stats-one-line'
                  ], check=True)
                  parts.append({'name': name, 'size': written,
                                'sha256': digest.hexdigest()})
                  index += 1
              finally:
                  local.unlink(missing_ok=True)
          if not parts:
              raise SystemExit('No compressed checkpoint data produced')
          manifest = {'format': 'chunked-zstd-tar-v1',
                      'part_bytes': part_bytes,
                      'parts': parts}
          manifest_path = scratch / 'r2-upload-manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          subprocess.run([
              'rclone', 'copyto', str(manifest_path), f'{prefix}/manifest.json',
              '--s3-upload-cutoff', '512M', '--retries', '5'
          ], check=True)
          print(f'Uploaded {len(parts)} verified-size chunks and manifest',
                file=sys.stderr, flush=True)
          PYUPLOAD

          echo "Streaming compressed incremental layer ${NEXT} as 256MiB single-PUT objects"
          # The FUSE view is excluded; backing and xattrs are included.
          # pipefail makes producer and uploader failures block the commit.
          tar -c --no-check-device --one-file-system \
            --xattrs --xattrs-include='user.*' \
            --listed-incremental="$NEW_STATE" \
            --exclude='./win_toolchain' \
            -C "$WORK" -f - . \
            | zstd -1 -T2 -c \
            | python3 "$RUNNER_TEMP/r2-upload-chunks.py" \
                "$R2_ROOT/layers/$NEXT" "$RUNNER_TEMP"

          else
            echo "::error::Unsupported upload mode $R2_UPLOAD_MODE"
            exit 1
          fi

          test -s "$NEW_STATE"
          rclone copyto "$NEW_STATE" "$R2_ROOT/state/$NEXT.snar" --retries 5
          # Publish pointer LAST, after all data and metadata are durable.
          printf '%s\n' "$NEXT" > "$RUNNER_TEMP/latest-new.txt"
          rclone copyto "$RUNNER_TEMP/latest-new.txt" "$R2_ROOT/latest.txt" --retries 5
          rclone copyto "$R2_ROOT/latest.txt" "$RUNNER_TEMP/latest-verify.txt" --retries 5
          cmp -s "$RUNNER_TEMP/latest-new.txt" "$RUNNER_TEMP/latest-verify.txt"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "layer=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Checkpoint $NEXT committed and verified (mode=$R2_UPLOAD_MODE)."

      # This step also works on a new runner after a completed build:
      # export_only=true restores R2 layers, then skips depot_tools, GN and Ninja.
      - name: Package Windows runtime and compiled libraries
        id: export
        if: ${{ steps.restore.outcome == 'success' && (inputs.export_only || steps.build.outputs.completed == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Package Chromium Windows artifacts'
          OUT="$WORK/chromium_build/src/out/Default"
          DIST="$GITHUB_WORKSPACE/chromium-export"
          test -s "$OUT/chrome.exe" || {
            echo '::error::Missing out/Default/chrome.exe in restored workspace'
            exit 1
          }
          test -f "$WORK/.build-complete" || {
            echo '::error::Checkpoint is not marked as a completed Chromium build'
            exit 1
          }
          mkdir -p "$DIST"
          echo '=== Check restored release outputs ==='
          ls -lh "$OUT/chrome.exe" "$OUT"/*.dll 2>/dev/null | head -60 || true
          echo '=== Stage runtime (exclude obj/gen and intermediate files) ==='

          python3 - "$OUT" "$DIST" "$CHROMIUM_VERSION" <<'PYEXPORT'
          from pathlib import Path
          import json
          import os
          import shutil
          import sys

          out, dist, version = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          runtime = dist / 'runtime' / 'chrome-win-x64'
          runtime.mkdir(parents=True, exist_ok=True)
          extensions = {'.exe', '.dll', '.pak', '.dat', '.bin', '.json',
                        '.manifest', '.png', '.ico', '.sig', '.xml'}
          special = {'First Run', 'LICENSE', 'README'}
          directories = {
              'locales', 'Locales', 'swiftshader', 'MEIPreload', 'Extensions',
              'VisualElements', 'WidevineCdm', 'PrivacySandboxAttestationsPreloaded',
              'resources', 'PKIMetadata', 'hyphen-data', 'screen_ai',
          }
          selected_files = []
          for child in sorted(out.iterdir(), key=lambda p: p.name.lower()):
              if child.is_file() and (child.suffix.lower() in extensions or
                                      child.name in special):
                  shutil.copy2(child, runtime / child.name)
                  selected_files.append(child.name)
              elif child.is_dir() and child.name in directories:
                  shutil.copytree(child, runtime / child.name,
                                  dirs_exist_ok=True, symlinks=False)
          if not (runtime / 'chrome.exe').is_file():
              raise SystemExit('Runtime package missing chrome.exe')
          (runtime / 'BUILD_INFO.txt').write_text(
              'Chromium ' + version + ' Windows x64\n'
              'Built with Chromium GN/Ninja (is_component_build=false, '
              'is_debug=false, symbol_level=0).\n'
              'This is an unpacked development build, NOT an installer.\n'
              'Windows execution has not been validated in this workflow.\n',
              encoding='utf-8')
          lib_paths = sorted(
              (p.relative_to(out) for p in out.rglob('*.lib') if p.is_file()),
              key=lambda p: p.as_posix())
          (dist / 'libs-filelist.nul').write_bytes(
              b''.join(os.fsencode(str(p)) + b'\0' for p in lib_paths))
          info = {
              'chromium_version': version,
              'target_os': 'win', 'target_cpu': 'x64',
              'runtime_files_at_root': selected_files,
              'libraries_count': len(lib_paths),
              'source': 'restored Chromium Ninja output',
          }
          (dist / 'manifest.json').write_text(
              json.dumps(info, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8')
          print(f'Runtime root files: {len(selected_files)}')
          print(f'Windows .lib files: {len(lib_paths)}')
          print('Runtime stage:', runtime)
          PYEXPORT

          RELEASE="chromium-${CHROMIUM_VERSION}-win-x64"
          RUNTIME_ZIP="$DIST/${RELEASE}-runtime.zip"
          (
            cd "$DIST/runtime"
            zip -q -r -1 "$RUNTIME_ZIP" chrome-win-x64
          )
          unzip -tq "$RUNTIME_ZIP" | tail -3
          echo '=== Package compiled .lib files separately ==='
          LIBS_ZST="$DIST/${RELEASE}-libs.tar.zst"
          if [ -s "$DIST/libs-filelist.nul" ]; then
            tar -C "$OUT" --null -T "$DIST/libs-filelist.nul" -cf - \
              | zstd -1 -T2 -o "$LIBS_ZST"
            zstd -t "$LIBS_ZST"
          else
            echo 'No compiled .lib files found; skipping libraries archive.'
          fi

          (
            cd "$DIST"
            sha256sum "$(basename "$RUNTIME_ZIP")" > "$(basename "$RUNTIME_ZIP").sha256"
            if [ -s "$LIBS_ZST" ]; then
              sha256sum "$(basename "$LIBS_ZST")" > "$(basename "$LIBS_ZST").sha256"
            fi
          )
          echo '=== Export archive sizes ==='
          ls -lh "$DIST"/*.zip "$DIST"/*.zst "$DIST"/*.sha256 "$DIST/manifest.json" 2>/dev/null || true
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "runtime_zip=$RUNTIME_ZIP" >> "$GITHUB_OUTPUT"
          echo "runtime_sha=$RUNTIME_ZIP.sha256" >> "$GITHUB_OUTPUT"
          echo "manifest=$DIST/manifest.json" >> "$GITHUB_OUTPUT"
          if [ -s "$LIBS_ZST" ]; then
            echo "libs_zst=$LIBS_ZST" >> "$GITHUB_OUTPUT"
            echo "libs_sha=$LIBS_ZST.sha256" >> "$GITHUB_OUTPUT"
            # Keep GitHub artifacts comfortably below the single-artifact cap.
            if (( $(stat -c %s "$LIBS_ZST") <= 8 * 1024 * 1024 * 1024 )); then
              echo 'libs_github_ready=true' >> "$GITHUB_OUTPUT"
            else
              echo 'libs_github_ready=false' >> "$GITHUB_OUTPUT"
              echo '::warning::Libraries exceed 8 GiB; publishing them to R2 only.'
            fi
          fi

      - name: Upload completed Windows files to Cloudflare R2
        id: export_r2
        if: ${{ always() && steps.export.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Upload built Chromium files to R2'
          DIST="$GITHUB_WORKSPACE/chromium-export"
          RELEASE_PATH="$R2_ROOT/exports/${CHROMIUM_VERSION}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Release location: $RELEASE_PATH"
          upload_verified() {
            local local_file="$1"
            local remote_file="$RELEASE_PATH/$(basename "$local_file")"
            test -s "$local_file"
            rclone copyto "$local_file" "$remote_file" \
              --s3-upload-cutoff 64M \
              --s3-chunk-size 64M \
              --s3-upload-concurrency 4 \
              --retries 5 --low-level-retries 10 \
              --stats 30s --stats-one-line
            local expected actual
            expected="$(stat -c %s "$local_file")"
            actual="$(rclone size "$remote_file" --json | jq -r '.bytes')"
            if [ "$expected" != "$actual" ]; then
              echo "::error::R2 export size mismatch $(basename "$local_file"): $expected != $actual"
              return 1
            fi
            echo "Verified R2 object: $(basename "$local_file") ($actual bytes)"
          }
          upload_verified "${{ steps.export.outputs.runtime_zip }}"
          upload_verified "${{ steps.export.outputs.runtime_sha }}"
          if [ -n "${{ steps.export.outputs.libs_zst }}" ]; then
            upload_verified "${{ steps.export.outputs.libs_zst }}"
            upload_verified "${{ steps.export.outputs.libs_sha }}"
          fi
          upload_verified "${{ steps.export.outputs.manifest }}"
          echo "release_path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"
          echo '=== R2 export summary ==='
          rclone lsf "$RELEASE_PATH" --files-only
          {
            echo "## Chromium Windows release files"
            echo "- R2 export: \`$RELEASE_PATH\`"
            echo "- Checkpoint remains at: \`$R2_ROOT\`"
            echo "- Runtime ZIP: \`$(basename '${{ steps.export.outputs.runtime_zip }}')\`"
            echo "- Compiled .lib files are a separate archive when present."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows runtime for GitHub download
        if: ${{ always() && steps.export.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-windows-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.export.outputs.runtime_zip }}
            ${{ steps.export.outputs.runtime_sha }}
            ${{ steps.export.outputs.manifest }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload compiled libraries for GitHub download
        if: ${{ always() && steps.export.outputs.libs_github_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-windows-libs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.export.outputs.libs_zst }}
            ${{ steps.export.outputs.libs_sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Dispatch next pass
        if: >-
          ${{
            inputs.auto_resume &&
            !inputs.export_only &&
            steps.checkpoint.outputs.committed == 'true' &&
            (
              steps.sync.outputs.resume == 'true' ||
              steps.toolchain.outputs.resume == 'true' ||
              steps.hooks.outputs.resume == 'true' ||
              steps.gn.outputs.resume == 'true' ||
              steps.build.outputs.resume == 'true'
            )
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PASS: ${{ inputs.pass }}
          MAX_PASSES: ${{ inputs.max_passes }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Auto resume dispatch'
          CURRENT="${CURRENT_PASS:-1}"
          MAX="${MAX_PASSES:-12}"
          [[ "$CURRENT" =~ ^[0-9]+$ && "$MAX" =~ ^[0-9]+$ ]]
          if (( CURRENT >= MAX )); then
            echo "Maximum passes reached: $MAX"
            exit 0
          fi
          NEXT=$((CURRENT + 1))

          # Resolve this run's actual workflow ID. This avoids hardcoding a
          # workflow filename (the repository currently uses chrome.yml).
          WORKFLOW_ID="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.workflow_id'
          )"
          if [[ ! "$WORKFLOW_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot resolve current workflow ID: $WORKFLOW_ID"
            exit 1
          fi

          echo "Dispatching workflow ID $WORKFLOW_ID, pass $NEXT/$MAX"
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[pass]=$NEXT" \
            -f "inputs[max_passes]=$MAX" \
            -f "inputs[r2_upload_mode]=$R2_UPLOAD_MODE" \
            -f 'inputs[auto_resume]=true'
          echo "Next build pass ($NEXT) dispatched successfully."

      - name: Final resource and build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/ci-metrics.sh" ]; then
            source "$GITHUB_WORKSPACE/ci-metrics.sh"
            ci_begin 'Final metrics'
          else
            df -h /
            free -h
          fi
          {
            echo '## Chromium Windows cross-build'
            echo "- Version: $CHROMIUM_VERSION"
            echo "- Btrfs image: ${IMAGE_GIB} GiB / ZSTD level ${BTRFS_ZSTD}"
            echo "- Checkpoint prefix: $R2_ROOT"
            echo "- R2 upload mode: $R2_UPLOAD_MODE"
            echo "- Restored layer: ${RESTORED_LAST:-0}"
            echo "- Committed layer: ${{ steps.checkpoint.outputs.layer || 'none' }}"
            echo "- Build completed: ${{ steps.build.outputs.completed || 'false' }}"
            echo "- Export-only: ${{ inputs.export_only || 'false' }}"
            echo "- Restore strategy: ${{ inputs.export_only && 'overlay (export recovery)' || 'incremental (Ninja resume)' }}"
            echo "- Export ready: ${{ steps.export.outputs.ready || 'false' }}"
            echo "- Release objects: ${{ steps.export_r2.outputs.release_path || 'none' }}"
            echo '```'
            df -h /
            free -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
