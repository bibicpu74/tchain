name: Cross-Build Chromium Windows - Btrfs R2 Resume

on:
  workflow_dispatch:
    inputs:
      auto_resume:
        description: Run the next pass automatically after checkpoint
        type: boolean
        default: false
      pass:
        description: Current pass number
        type: string
        default: '1'
      max_passes:
        description: Maximum automatic passes
        type: string
        default: '12'

permissions:
  contents: read
  actions: write

concurrency:
  group: chromium-windows-155-r2-v3
  cancel-in-progress: false

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CHROMIUM_VERSION: '155.0.8059.79'
      WORK: /mnt/chromium-ci/work
      IMAGE: /home/runner/work/chromium-ci.img
      IMAGE_GIB: '220'
      BTRFS_ZSTD: '1'
      MIN_FREE_GIB: '12'
      BUILD_JOBS: '2'
      # Keep different configurations in distinct R2 prefixes.
      R2_ROOT: r2:${{ vars.R2_BUCKET }}/chromium-win155-x64-v3
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_REGION: auto
      DEPOT_TOOLS_WIN_TOOLCHAIN: '1'
      GIT_TERMINAL_PROMPT: '0'
      TOOLCHAIN_URL: https://pub-8f1f5b85dfa3490cb6526249c67b4237.r2.dev/chromium-win-toolchain-vs2026-sdk28000.zip
      TOOLCHAIN_SHA256: ${{ vars.TOOLCHAIN_SHA256 }}

    steps:
      - name: Reclaim disk and install build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          FREE_BEFORE=$(df -Pk / | awk 'NR==2 {print $4}')
          echo '=== BEFORE CLEANUP ==='
          df -h /
          free -h

          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile /mnt/soong-swap-base || true
          sudo systemctl stop docker.service docker.socket containerd.service 2>/dev/null || true
          sudo rm -rf \
            /var/lib/docker /var/lib/containerd /var/cache/apt/archives/* \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/lib/node_modules /usr/local/graalvm \
            /usr/share/rust /usr/share/php* /usr/local/share/chromium \
            /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/local/share/vcpkg /opt/google /opt/microsoft /usr/share/postgresql \
            /usr/share/mysql /usr/local/julia* /opt/az \
            /usr/local/google-cloud-sdk /usr/lib/google-cloud-sdk \
            /usr/local/share/gradle /usr/share/gradle /opt/pipx \
            /home/runner/.gradle/caches /home/runner/.npm/_cacache \
            /home/runner/.cache/pip /root/.cache/pip || true

          sudo apt-get clean || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            btrfs-progs ciopfs fuse3 rclone zstd unzip jq git git-lfs ninja-build
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          cat > "$GITHUB_WORKSPACE/ci-metrics.sh" <<'SH'
          ci_metrics() {
            echo '====== CI RESOURCE REPORT ======'
            echo "Time: $(date -u +%FT%TZ)"
            echo "CPU: $(nproc)"
            echo '--- RAM / Swap ---'
            free -h || true
            echo '--- Host disk ---'
            df -h / || true
            echo '--- Host free bytes ---'
            df -PB1 / || true
            if mountpoint -q /mnt/chromium-ci; then
              echo '--- Btrfs filesystem ---'
              df -h /mnt/chromium-ci || true
              sudo btrfs filesystem usage /mnt/chromium-ci || true
            fi
            if [ -f "${IMAGE:-/nonexistent}" ]; then
              echo '--- Sparse image actual disk usage ---'
              du -h "$IMAGE" || true
            fi
            echo '================================'
          }
          ci_begin() {
            echo "=== STEP: $1 ==="
            ci_metrics
            trap 'ci_metrics' EXIT
          }
          SH

          FREE_AFTER=$(df -Pk / | awk 'NR==2 {print $4}')
          awk -v before="$FREE_BEFORE" -v after="$FREE_AFTER" \
            'BEGIN {printf "Before: %.2f GiB, after: %.2f GiB, net change: %.2f GiB\n", before/1048576, after/1048576, (after-before)/1048576}'
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Disk cleanup'
          rclone version
          ninja --version

      - name: Create Btrfs 220 GiB ZSTD1 workspace
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Btrfs init'
          sudo install -d -m 0755 /mnt/chromium-ci
          sudo truncate -s "${IMAGE_GIB}G" "$IMAGE"
          sudo mkfs.btrfs -f -q "$IMAGE"
          sudo mount -o loop,compress=zstd:1,discard=async "$IMAGE" /mnt/chromium-ci
          sudo chown "$USER:$USER" /mnt/chromium-ci
          mkdir -p "$WORK"
          findmnt /mnt/chromium-ci

      - name: Restore committed checkpoint from R2
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'R2 restore'
          : "${R2_BUCKET:?Set Actions variable R2_BUCKET}"
          : "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}"
          : "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}"
          rclone lsf "r2:$R2_BUCKET" >/dev/null

          echo "Checkpoint prefix: $R2_ROOT"
          LISTING="$(rclone lsjson "$R2_ROOT" --files-only --no-modtime --no-mimetype)"
          POINTER_SIZE="$(jq -r '[.[] | select(.Name == "latest.txt") | .Size] | first // -1' <<< "$LISTING")"
          LAST=0
          if (( POINTER_SIZE == -1 )); then
            echo 'No committed checkpoint: fresh build (layer 0).'
          elif (( POINTER_SIZE == 0 )); then
            echo '::error::R2 latest.txt is empty. Refusing destructive fallback.'
            exit 1
          else
            rclone copyto "$R2_ROOT/latest.txt" "$RUNNER_TEMP/latest.txt" --retries 5
            LAST="$(tr -d '[:space:]' < "$RUNNER_TEMP/latest.txt")"
            [[ "$LAST" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Invalid checkpoint pointer: $LAST"
              exit 1
            }
          fi
          echo "Committed checkpoint: $LAST"

          if (( LAST > 0 )); then
            for N in $(seq 1 "$LAST"); do
              echo "=== Restoring layer $N/$LAST ==="
              rclone cat "$R2_ROOT/layers/$N.tar.zst" --retries 5 \
                | zstd -d -T2 -c \
                | tar -x --listed-incremental=/dev/null \
                    --no-same-owner --no-same-permissions -C "$WORK" -f -
            done
            rclone copyto "$R2_ROOT/state/$LAST.snar" "$RUNNER_TEMP/previous.snar" --retries 5
            test -s "$RUNNER_TEMP/previous.snar"
          fi
          mkdir -p "$WORK"
          echo "RESTORED_LAST=$LAST" >> "$GITHUB_ENV"
          echo "checkpoint=$LAST" >> "$GITHUB_OUTPUT"
          echo "R2 restore complete at layer $LAST"

      - name: Set up depot_tools
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'depot_tools'
          if [ ! -d "$WORK/depot_tools/.git" ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK/depot_tools"
          fi
          echo "$WORK/depot_tools" >> "$GITHUB_PATH"
          export PATH="$WORK/depot_tools:$PATH"
          command -v gclient

      - name: Fetch or resume Chromium sources
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Chromium sync'
          export PATH="$WORK/depot_tools:$PATH"
          ROOT="$WORK/chromium_build"
          SRC="$ROOT/src"
          mkdir -p "$ROOT"
          if [ -f "$WORK/.source-ready" ] && [ -f "$SRC/DEPS" ]; then
            echo 'Restored synchronized sources.'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEADLINE=$((RUN_START + 260*60))
          LEFT=$((DEADLINE - $(date +%s)))
          if (( LEFT < 300 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 --branch "$CHROMIUM_VERSION" \
              https://chromium.googlesource.com/chromium/src.git "$SRC"
          fi
          cd "$ROOT"
          if [ ! -f .gclient ]; then
            gclient config --unmanaged --name=src https://chromium.googlesource.com/chromium/src.git
          fi
          # Ensure host Linux dependencies plus Windows dependencies are synchronized.
          python3 - <<'PY'
          from pathlib import Path
          f = Path('.gclient')
          s = f.read_text()
          if 'target_os =' not in s:
              f.write_text(s + "\ntarget_os = ['win']\n")
          elif "target_os = ['win']" not in s:
              raise SystemExit('Unexpected .gclient target_os setting')
          PY
          LEFT=$((DEADLINE - $(date +%s)))
          if (( LEFT < 300 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          timeout -s INT -k 90s "${LEFT}s" \
            gclient sync --nohooks --no-history --jobs 4
          RC=$?
          set -e
          if (( RC == 0 )); then
            touch "$WORK/.source-ready"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif (( RC == 124 )); then
            echo 'Sync time slice complete, checkpointing.'
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            echo "::error::gclient sync failed with $RC"
            exit "$RC"
          fi

      - name: Install VS 2026 SDK28000 toolchain (nested ZIP aware)
        id: toolchain
        if: steps.sync.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Windows toolchain - inspect, extract and validate'
          export PATH="$WORK/depot_tools:$PATH"
          SRC="$WORK/chromium_build/src"
          BACKING="$WORK/win_toolchain_backing"
          VIEW="$WORK/win_toolchain"
          CACHE="$WORK/toolchain-download"
          mkdir -p "$BACKING" "$VIEW" "$CACHE"
          if ! mountpoint -q "$VIEW"; then
            ciopfs -o use_ino "$BACKING" "$VIEW"
          fi
          mountpoint -q "$VIEW" || { echo '::error::ciopfs mount failed'; exit 1; }

          # Existing backing files are checkpointed, but FUSE mount is NOT:
          # remount ciopfs before checking the toolchain on each new runner.
          if [ -f "$WORK/.win-toolchain-ready" ] && \
             [ -f "$SRC/build/win_toolchain.json" ] && \
             [ -f "$VIEW/VS_VERSION" ] && \
             [ -f "$VIEW/Windows Kits/10/bin/SetEnv.x64.json" ]; then
            echo 'Restored VS/SDK package; skipping download and extraction.'
          else
            LEFT=$((RUN_START + 260*60 - $(date +%s)))
            if (( LEFT < 1200 )); then
              echo 'Not enough time left to download/extract; checkpointing.'
              echo 'resume=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ZIP="$CACHE/package.zip"
            if [ ! -s "$ZIP" ]; then
              echo '=== Downloading toolchain ZIP to persistent Btrfs cache ==='
              # A .part download is not trusted; resume transfers only if server
              # supports HTTP Range, otherwise curl restarts the download.
              set +e
              timeout -s INT -k 90s "${LEFT}s" \
                curl -fL --retry 5 --retry-delay 5 \
                  --continue-at - "$TOOLCHAIN_URL" -o "$CACHE/package.part"
              RC=$?
              set -e
              if (( RC == 124 )); then
                echo 'Toolchain transfer time slice reached.'
                echo 'resume=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              (( RC == 0 )) || exit "$RC"
              mv "$CACHE/package.part" "$ZIP"
            fi
            if [ -n "${TOOLCHAIN_SHA256:-}" ]; then
              echo "$TOOLCHAIN_SHA256  $ZIP" | sha256sum -c -
            fi

            echo '=== Inspect ZIP nesting, entries and SDK version ==='
            LEFT=$((RUN_START + 260*60 - $(date +%s)))
            if (( LEFT < 300 )); then
              echo 'Not enough time for extraction; preserving ZIP in R2 checkpoint.'
              echo 'resume=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # The Windows packaging action uploaded a ZIP *inside* an Actions
            # Artifact. Python zipfile + normalized paths supports either format.
            # Extract to the backing tree, not the ciopfs FUSE view.
            set +e
            timeout -s INT -k 90s "${LEFT}s" \
              python3 - "$ZIP" "$BACKING" <<'PY'
          import os
          import re
          import shutil
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          outer = Path(sys.argv[1])
          backing = Path(sys.argv[2])
          sdk = '10.0.28000.0'

          def norm(name):
              # ZIPs produced on Windows may use either slash convention.
              return name.replace('\\', '/').lstrip('./')

          def summary(zf, label):
              names = [norm(i.filename) for i in zf.infolist()]
              print(f'{label}: {len(names)} entries', flush=True)
              for name in names[:18]:
                  print('  ZIP:', name, flush=True)
              return names

          def package_prefix(names):
              # Official package_from_installed.py includes VS_VERSION at root.
              markers = [n[:-len('VS_VERSION')] for n in names
                         if n.casefold().endswith('vs_version')]
              for prefix in sorted(markers, key=len):
                  low = [n[len(prefix):].lower() for n in names
                         if n.startswith(prefix)]
                  has_vs = any(re.match(
                      r'vc/tools/msvc/[^/]+/include/', n) for n in low)
                  has_sdk = any(n.startswith(
                      f'windows kits/10/include/{sdk.lower()}/') for n in low)
                  if has_vs and has_sdk:
                      return prefix
              return None

          def extract(zf, prefix, dest):
              count = 0
              for info in zf.infolist():
                  path = norm(info.filename)
                  if not path.startswith(prefix):
                      continue
                  relative = path[len(prefix):]
                  if not relative or info.is_dir() or path.endswith('/'):
                      continue
                  parts = relative.split('/')
                  if any(p in ('', '.', '..') for p in parts) or ':' in parts[0]:
                      raise SystemExit(f'Unsafe path in ZIP: {relative!r}')
                  target = dest.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  # Atomic replacement avoids trusting partial extracted files
                  # when the process is interrupted and a later pass resumes.
                  tmp = target.with_name(target.name + '.ci-unpacking')
                  with zf.open(info) as src, open(tmp, 'wb') as out:
                      shutil.copyfileobj(src, out, length=2 * 1024 * 1024)
                  os.replace(tmp, target)
                  count += 1
                  if count % 3000 == 0:
                      print(f'Extracted {count} files...', flush=True)
              print(f'Extracted {count} package files to {dest}', flush=True)
              if count == 0:
                  raise SystemExit('ZIP selection contained no files')

          with zipfile.ZipFile(outer) as zf:
              names = summary(zf, 'Downloaded archive')
              prefix = package_prefix(names)
              if prefix is None:
                  candidates = [i for i in zf.infolist()
                                if re.search(r'(?i)(?:^|/)[0-9a-f]{10}\.zip$',
                                             norm(i.filename))]
                  if len(candidates) != 1:
                      candidates = [i for i in zf.infolist()
                                    if norm(i.filename).lower().endswith('.zip')]
                  if len(candidates) != 1:
                      raise SystemExit(
                          'Archive contains no VS_VERSION/MSVC/SDK tree and '
                          f'{len(candidates)} nested ZIP candidates; '
                          'expected toolchain ZIP or a GitHub Artifact ZIP.')
                  inner_name = norm(candidates[0].filename)
                  print('Found nested toolchain ZIP:', inner_name, flush=True)
                  with tempfile.NamedTemporaryFile(
                      dir=outer.parent, suffix='.zip') as temp:
                      with zf.open(candidates[0]) as src:
                          shutil.copyfileobj(src, temp, length=4 * 1024 * 1024)
                      temp.flush()
                      with zipfile.ZipFile(temp.name) as nested:
                          summary(nested, 'Nested package')
                          prefix = package_prefix(
                              [norm(i.filename) for i in nested.infolist()])
                          if prefix is None:
                              raise SystemExit(
                                  'Nested ZIP does not contain MSVC + SDK '
                                  f'{sdk} + VS_VERSION: verify publishing URL.')
                          archives = [(nested, prefix)]
                          extract(archives[0][0], archives[0][1], backing)
              else:
                  extract(zf, prefix, backing)

          PY
            RC=$?
            set -e
            if (( RC == 124 )); then
              echo 'Toolchain extraction time slice elapsed; retry next pass.'
              echo 'resume=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            (( RC == 0 )) || exit "$RC"

            # Clean up files left by the previous Linux unzip implementation:
            # a GitHub Artifact inner ZIP or Windows backslash-named flat files.
            find "$BACKING" -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*\\*' \) -print -delete || true

            # Configure Chromium using the packaged, already generated
            # SetEnv.x64.json (not a home-made INCLUDE/LIB approximation).
            python3 - "$VIEW" "$BACKING" "$SRC" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          view, backing, src = map(Path, sys.argv[1:])
          setup = src / 'build/toolchain/win/setup_toolchain.py'
          source = setup.read_text()
          match = re.search(r'^SDK_VERSION\s*=\s*[\'\"]([^\'\"]+)', source, re.M)
          expected_sdk = match.group(1) if match else '10.0.28000.0'
          sdk = '10.0.28000.0'
          if expected_sdk != sdk:
              raise SystemExit(f'Chromium expects Windows SDK {expected_sdk}, '
                               f'but ZIP contains {sdk}.')

          root = view
          vs_version = (root / 'VS_VERSION').read_text().strip()
          if vs_version != '2026':
              raise SystemExit(f'Unexpected VS_VERSION={vs_version!r}')

          incs = sorted((root / 'VC/Tools/MSVC').glob('*/include'))
          sdkroot = root / 'Windows Kits/10'
          sdkinc = sdkroot / 'Include' / sdk
          if not incs or not (sdkinc / 'um').is_dir() or not (sdkinc / 'ucrt').is_dir():
              raise SystemExit('Toolchain ZIP missing VC headers or SDK Include/10.0.28000.0')

          vc_root = incs[-1].parent
          vc_bin = vc_root / 'bin/HostX64/x64'
          required = [
              vc_bin / 'cl.exe',
              vc_root / 'lib/x64',
              sdkroot / 'Lib' / sdk / 'um/x64',
              sdkroot / 'Lib' / sdk / 'ucrt/x64',
              sdkroot / 'bin/SetEnv.x64.json',
          ]
          for p in required:
              if not p.exists():
                  raise SystemExit(f'Missing toolchain component: {p}')

          # Windows packager already generated these relative path lists.
          # Normalize backslash tokens for Linux os.path.join(), preserving
          # all original INCLUDE/LIB/PATH entries.
          original = backing / 'Windows Kits/10/bin/SetEnv.x64.json'
          data = json.loads(original.read_text())
          env = data['env']
          for key, groups in env.items():
              env[key] = [[part.replace('\\', '/') for part in parts]
                          for parts in groups]
          original.write_text(json.dumps(data, indent=2))

          def runtime(d):
              p = root / d
              return str(p) if p.is_dir() else 'Arm64Unused'

          config = {
              'path': str(root),
              'version': vs_version,
              'win_sdk': str(sdkroot),
              'wdk': '',
              'runtime_dirs': [runtime('sys64'), runtime('sys32'),
                               runtime('sysarm64')],
          }
          result = src / 'build/win_toolchain.json'
          result.write_text(json.dumps(config, indent=2))
          print('VS:', vs_version, 'MSVC:', vc_root.name)
          print('SDK:', sdkroot, 'version:', sdk)
          print('SetEnv:', original)
          print('Chromium configuration:', result)
          PY
            touch "$WORK/.win-toolchain-ready"
            # A successful extraction no longer needs a second ZIP copy in R2.
            rm -f "$CACHE/package.zip" "$CACHE/package.part"
          fi
          test -f "$SRC/build/win_toolchain.json"
          test -f "$VIEW/Windows Kits/10/bin/SetEnv.x64.json"
          python3 "$SRC/build/vs_toolchain.py" get_toolchain_dir

      - name: Run Chromium gclient hooks
        id: hooks
        if: steps.toolchain.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'gclient hooks'
          export PATH="$WORK/depot_tools:$PATH"
          if [ -f "$WORK/.hooks-ready" ]; then
            echo 'Hooks restored.'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LEFT=$((RUN_START + 260*60 - $(date +%s)))
          if (( LEFT < 300 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$WORK/chromium_build"
          set +e
          DEPOT_TOOLS_WIN_TOOLCHAIN=0 timeout -s INT -k 90s "${LEFT}s" gclient runhooks
          RC=$?
          set -e
          if (( RC == 0 )); then
            touch "$WORK/.hooks-ready"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif (( RC == 124 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            echo "::error::gclient runhooks failed with $RC"
            exit "$RC"
          fi

      - name: Generate GN build graph
        id: gn
        if: steps.hooks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'GN gen'
          export PATH="$WORK/depot_tools:$PATH"
          cd "$WORK/chromium_build/src"
          if (( RUN_START + 260*60 - $(date +%s) < 300 )); then
            echo 'Not enough time for GN; saving checkpoint.'
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p out/Default
          cat > out/Default/args.gn <<'GN'
          target_os = "win"
          target_cpu = "x64"
          is_debug = false
          is_component_build = false
          is_official_build = false
          is_clang = true
          symbol_level = 0
          blink_symbol_level = 0
          GN
          # Do not set visual_studio_path: use the installed hermetic JSON.
          python3 build/vs_toolchain.py get_toolchain_dir
          gn gen out/Default
          test -f out/Default/build.ninja
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Continue incremental Ninja build
        id: build
        if: steps.gn.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Ninja build'
          export PATH="$WORK/depot_tools:$PATH"
          cd "$WORK/chromium_build/src"
          LEFT=$((RUN_START + 260*60 - $(date +%s)))
          if (( LEFT < 300 )); then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Build time budget: ${LEFT}s; jobs=${BUILD_JOBS}"
          set +e
          timeout -s INT -k 120s "${LEFT}s" \
            ninja -C out/Default -j "$BUILD_JOBS" chrome \
            > "$WORK/ninja-build.log" 2>&1 &
          PID=$!
          STOPPED_FOR_DISK=0
          while kill -0 "$PID" 2>/dev/null; do
            sleep 45
            tail -n 8 "$WORK/ninja-build.log" || true
            FREE_KIB=$(df -Pk / | awk 'NR==2 {print $4}')
            if (( FREE_KIB < MIN_FREE_GIB*1024*1024 )); then
              echo "Low physical free space: ${FREE_KIB} KiB; stopping Ninja."
              STOPPED_FOR_DISK=1
              kill -INT "$PID" || true
              break
            fi
          done
          wait "$PID"
          RC=$?
          set -e
          if (( RC == 0 )); then
            test -f out/Default/chrome.exe
            touch "$WORK/.build-complete"
            echo 'completed=true' >> "$GITHUB_OUTPUT"
          elif (( RC == 124 || STOPPED_FOR_DISK == 1 )); then
            echo 'Build interrupted safely for checkpoint.'
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            tail -n 100 "$WORK/ninja-build.log" || true
            echo "::error::Ninja failed with $RC"
            exit "$RC"
          fi

      - name: Upload incremental checkpoint to R2
        id: checkpoint
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'R2 incremental checkpoint'
          PREV="${RESTORED_LAST:-0}"
          NEXT=$((PREV + 1))
          NEW_STATE="$RUNNER_TEMP/new.snar"
          if (( PREV > 0 )); then
            cp "$RUNNER_TEMP/previous.snar" "$NEW_STATE"
          fi
          echo "Streaming incremental tar layer ${NEXT} to R2"
          # The FUSE view is excluded. Its persistent backing directory is included.
          tar -c --no-check-device --one-file-system \
            --listed-incremental="$NEW_STATE" \
            --exclude='./win_toolchain' \
            -C "$WORK" -f - . \
            | zstd -1 -T2 -c \
            | rclone rcat "$R2_ROOT/layers/$NEXT.tar.zst" \
                --s3-chunk-size 32M --s3-upload-concurrency 2 \
                --stats 60s --stats-one-line

          rclone copyto "$NEW_STATE" "$R2_ROOT/state/$NEXT.snar" --retries 5
          # Publish pointer last, only after archive and .snar were uploaded.
          printf '%s\n' "$NEXT" > "$RUNNER_TEMP/latest-new.txt"
          rclone copyto "$RUNNER_TEMP/latest-new.txt" "$R2_ROOT/latest.txt" --retries 5
          rclone copyto "$R2_ROOT/latest.txt" "$RUNNER_TEMP/latest-verify.txt" --retries 5
          cmp -s "$RUNNER_TEMP/latest-new.txt" "$RUNNER_TEMP/latest-verify.txt"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "layer=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Checkpoint $NEXT committed and verified."

      - name: Dispatch next pass
        if: >-
          ${{
            inputs.auto_resume &&
            steps.checkpoint.outputs.committed == 'true' &&
            (
              steps.sync.outputs.resume == 'true' ||
              steps.toolchain.outputs.resume == 'true' ||
              steps.hooks.outputs.resume == 'true' ||
              steps.gn.outputs.resume == 'true' ||
              steps.build.outputs.resume == 'true'
            )
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PASS: ${{ inputs.pass }}
          MAX_PASSES: ${{ inputs.max_passes }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/ci-metrics.sh"
          ci_begin 'Auto resume dispatch'
          CURRENT="${CURRENT_PASS:-1}"
          MAX="${MAX_PASSES:-12}"
          [[ "$CURRENT" =~ ^[0-9]+$ && "$MAX" =~ ^[0-9]+$ ]]
          if (( CURRENT >= MAX )); then
            echo "Maximum passes reached: $MAX"
            exit 0
          fi
          NEXT=$((CURRENT + 1))
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/chromium-win-linux.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[pass]=$NEXT" \
            -f "inputs[max_passes]=$MAX" \
            -f 'inputs[auto_resume]=true'

      - name: Final resource and build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/ci-metrics.sh" ]; then
            source "$GITHUB_WORKSPACE/ci-metrics.sh"
            ci_begin 'Final metrics'
          else
            df -h /
            free -h
          fi
          {
            echo '## Chromium Windows cross-build'
            echo "- Version: $CHROMIUM_VERSION"
            echo "- Btrfs image: ${IMAGE_GIB} GiB / ZSTD level ${BTRFS_ZSTD}"
            echo "- Checkpoint prefix: $R2_ROOT"
            echo "- Restored layer: ${RESTORED_LAST:-0}"
            echo "- Committed layer: ${{ steps.checkpoint.outputs.layer || 'none' }}"
            echo "- Build completed: ${{ steps.build.outputs.completed || 'false' }}"
            echo '```'
            df -h /
            free -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
